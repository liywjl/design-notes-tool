<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Todos — demo page for design-notes</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #f4f4f7; color: #24292f; }
  .app { max-width: 520px; margin: 56px auto; }
  h1 { text-align: center; font-size: 30px; color: #4a4e69; margin-bottom: 20px; }
  .panel { background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.07); overflow: hidden; }
  .new { display: flex; gap: 10px; padding: 16px; border-bottom: 1px solid #ececf0; }
  .new input { flex: 1; padding: 10px 12px; border: 1px solid #d5d5dd; border-radius: 6px; font-size: 15px; }
  .new button { padding: 10px 18px; border: none; border-radius: 6px; background: #6c63ff; color: #fff; font-weight: 600; cursor: pointer; }
  ul { list-style: none; }
  li { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid #ececf0; }
  li input[type=checkbox] { width: 18px; height: 18px; }
  li.done label { text-decoration: line-through; color: #9a9aa5; }
  li label { flex: 1; font-size: 15px; }
  li .del { border: none; background: none; color: #c0c0c9; font-size: 16px; cursor: pointer; }
  .foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-size: 13px; color: #7c7c88; }
  .foot .count { flex: 1; }
  .foot button { border: 1px solid transparent; background: none; color: inherit; padding: 4px 10px; border-radius: 5px; cursor: pointer; }
  .foot button.active { border-color: #6c63ff; color: #6c63ff; }
  footer { text-align: center; color: #a0a0ab; font-size: 12px; margin-top: 22px; }
</style>
</head>
<body>
  <div class="app">
    <h1>todos</h1>
    <div class="panel">
      <div class="new">
        <input id="new-todo" placeholder="What needs doing?" />
        <button id="add">Add</button>
      </div>
      <ul id="list">
        <li><input type="checkbox" /><label>Water the plants</label><button class="del">✕</button></li>
        <li class="done"><input type="checkbox" checked /><label>Book dentist appointment</label><button class="del">✕</button></li>
        <li><input type="checkbox" /><label>Reply to the plumber</label><button class="del">✕</button></li>
        <li><input type="checkbox" /><label>Buy oat milk</label><button class="del">✕</button></li>
      </ul>
      <div class="foot">
        <span class="count">3 items left</span>
        <button class="active">All</button>
        <button>Active</button>
        <button>Done</button>
      </div>
    </div>
    <footer>A deliberately ordinary to-do app, invented for this demo.<br />
    The design-notes tool is already loaded on this page — hold <b>Alt</b> and hover, then Alt+click to leave a note.</footer>
  </div>
  <script>
    const list = document.getElementById('list');
    const refresh = () => {
      document.querySelectorAll('#list li').forEach((li) => li.classList.toggle('done', li.querySelector('input').checked));
      document.querySelector('.count').textContent = `${[...document.querySelectorAll('#list input')].filter((c) => !c.checked).length} items left`;
    };
    list.addEventListener('change', refresh);
    list.addEventListener('click', (e) => { if (e.target.classList.contains('del')) { e.target.closest('li').remove(); refresh(); } });
    document.getElementById('add').onclick = () => {
      const input = document.getElementById('new-todo');
      if (!input.value.trim()) return;
      const li = document.createElement('li');
      li.innerHTML = '<input type="checkbox" /><label></label><button class="del">✕</button>';
      li.querySelector('label').textContent = input.value.trim();
      list.appendChild(li);
      input.value = '';
      refresh();
    };
  </script>
  <script src="../design-notes.js"></script>
</body>
</html>
